services:
  postgres: 
    image: postgres:18-alpine
    container_name: s21-rpg-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: s21-rpg-cards

    ports:
      - "5432:5432"

    # postgres 18+ stores data in a major-version-specific subdirectory
    # (e.g. /var/lib/postgresql/18/docker), so mount the parent dir.
    # Mounting at /var/lib/postgresql/data is rejected by the 18+ image
    # (docker-library/postgres#1259).
    volumes:
      - ./postgres-data:/var/lib/postgresql